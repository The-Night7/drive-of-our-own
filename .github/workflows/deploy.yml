name: Index & deploy

# Runs on its own: every 6 hours, on every push to main, and when a drive is
# added through the site's form. Each run:
#   1. finds the drives (master Drive folder + data/sources.json),
#   2. re-lists every drive once a day (in between, only newly added drives),
#   3. downloads new fics and extracts their AO3 tags (cached between runs),
#   4. publishes the index as a release asset and redeploys the site on Vercel
#      (the Vercel build downloads it: see scripts/fetch-index.mjs).

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      full_crawl:
        description: 'Re-list every drive now (otherwise once a day)'
        type: boolean
        default: false

permissions:
  contents: write # to publish the index release

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # The drive listing and the per-file tag cache live in the Actions cache,
      # so each run only does the work that's new.
      - name: Restore index cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/listing.json
            data/meta-cache
          key: index-${{ github.run_id }}
          restore-keys: index-

      - name: Find and list drives
        env:
          FULL: ${{ inputs.full_crawl }}
        run: |
          if [ "$FULL" = "true" ]; then
            node scripts/crawl.mjs --max-minutes 120
          else
            node scripts/crawl.mjs --max-minutes 120 --if-older-than-hours 20
          fi

      - name: Extract tags and build the index
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Pushes only need a quick rebuild; scheduled runs chew through the backlog.
          if [ "$EVENT" = "push" ]; then MIN=15; else MIN=170; fi
          node scripts/build-index.mjs --max-minutes $MIN --concurrency 8

      - name: Save index cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/listing.json
            data/meta-cache
          key: index-${{ github.run_id }}

      - name: Publish the index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf index-bundle.tgz -C public index.json details
          ls -la index-bundle.tgz
          gh release view index-data >/dev/null 2>&1 || gh release create index-data \
            --title "Search index (rebuilt automatically)" \
            --notes "Built by the Index & deploy workflow and downloaded by the Vercel build. Not meant to be used by hand."
          gh release upload index-data index-bundle.tgz --clobber

      - name: Redeploy on Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::No VERCEL_DEPLOY_HOOK secret, so Vercel won't pick up the new index until its next deploy."
          else
            curl -fsS -X POST "$HOOK" && echo
          fi
