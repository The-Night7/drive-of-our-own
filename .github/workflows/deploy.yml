name: Index & deploy

# The slow, thorough run: every 6 hours (or by hand), up to ~3 h long.
#   1. finds the drives (master Drive folder + data/sources.json),
#   2. re-lists every drive once a day (in between, only newly added drives),
#   3. downloads new fics and extracts their AO3 tags (cached between runs),
#   4. publishes the index as a release asset and redeploys the site on Vercel
#      (the Vercel build downloads it: see scripts/fetch-index.mjs).
# Pushes and newly added drives are handled by quick-index.yml, in parallel.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      full_crawl:
        description: 'Re-list every drive now (otherwise once a day)'
        type: boolean
        default: false

permissions:
  contents: write # to publish the index release

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # The drive listing and the per-file tag cache live in the Actions cache,
      # so each run only does the work that's new.
      - name: Restore index cache
        uses: actions/cache/restore@v5
        with:
          path: |
            data/listing.json
            data/meta-cache
          key: index-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: index-

      # Safety net: anything the last published index has tags for and this cache lacks (cache
      # evicted, or a run failed to save it) is imported, so tags are never lost.
      - name: Refill the cache from the published index
        run: node scripts/seed-cache.mjs

      - name: Find and list drives
        env:
          FULL: ${{ inputs.full_crawl }}
        run: |
          if [ "$FULL" = "true" ]; then
            node scripts/crawl.mjs --max-minutes 120
          else
            node scripts/crawl.mjs --max-minutes 120 --if-older-than-hours 20
          fi

      - name: Extract tags and build the index
        run: node scripts/build-index.mjs --max-minutes 170 --concurrency 8

      - name: Save index cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            data/listing.json
            data/meta-cache
          key: index-${{ github.run_id }}-${{ github.run_attempt }}

      # This run can last hours. Drives added meanwhile (they're in data/sources.json on
      # main, but not in this checkout) are listed now so the published index has them.
      - name: Pick up drives added during this run
        run: |
          git fetch -q origin main
          git checkout -q origin/main -- data/sources.json data/config.json
          node scripts/crawl.mjs --max-minutes 10 --if-older-than-hours 20
          node scripts/build-index.mjs --limit 0

      - name: Publish the index and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: scripts/publish-index.sh
